<div class="d-flex align-items-center auth px-0" *ngIf="!doneSubmitting">
    <div class="row w-100 mx-0">
        <div class="col-lg-4 mx-auto">
            <div class="auth-form-light text-left py-5 px-4 px-sm-5">

                <div class="brand-logo text-center">
                    <img src="assets/images/invitation.png" alt="logo">
                </div>

                <h4 class="text-center">Welcome to Invitations.</h4>

                <form [formGroup]="regForm" class="pt-3" (ngSubmit)="submitForm()">
                    <div class="form-group">
                        <input type="text" class="form-control form-control-lg" id="fullName"
                            formControlName="fullName" placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-control form-control-lg" id="email"
                            formControlName="email" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <input type="tel" class="form-control form-control-lg" id="phone"
                            formControlName="phone" placeholder="Phone">
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-control form-control-lg" id="company"
                            formControlName="company" placeholder="Company">
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-control form-control-lg" id="sector"
                            formControlName="sector" placeholder="Sector">
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-control form-control-lg" id="title"
                            formControlName="title" placeholder="Title">
                    </div>
                    
                    <div class="mt-3">
                        <button type="submit" class="btn btn-warning btn-fw w-100" [disabled]="regForm.invalid">
                            Submit
                        </button>
                    </div>

                    <p *ngIf="regForm.errors" class="text-danger font-weight-bold mt-3">
                        Invalid username or password
                    </p>

                </form>
            </div>
        </div>
    </div>
</div>
<div class="d-flex align-items-center text-center error-page bg-primary pt-5 pb-4 h-100" *ngIf="doneSubmitting">
    <div class="row flex-grow">
        <div class="col-lg-8 mx-auto text-white">
            <div class="row align-items-center d-flex flex-row" *ngIf="submittedSuccessfully || alreadySubmitted">
                <div class="col-lg-6 text-lg-right pr-lg-4">
                    <h1 class="display-1 mb-0">Yeah</h1>
                </div>
                <div class="col-lg-6 error-page-divider text-lg-left pl-lg-4">
                    <h2>Thanks</h2>
                    <h3 class="font-weight-light" *ngIf="submittedSuccessfully">You submited the form</h3>
                    <h3 class="font-weight-light" *ngIf="alreadySubmitted">You already submited the form</h3>
                </div>
            </div>

            <div class="row align-items-center d-flex flex-row" *ngIf="notEligible || somethingWentWrong">
                <div class="col-lg-6 text-lg-right pr-lg-4">
                    <h1 class="display-1 mb-0">Oops</h1>
                </div>
                <div class="col-lg-6 error-page-divider text-lg-left pl-lg-4">
                    <h2>Sorry</h2>
                    <h3 class="font-weight-light" *ngIf="notEligible">You are not eligible for this invitation.</h3>
                    <h3 class="font-weight-light" *ngIf="somethingWentWrong">Something went wrong. please, try again later.</h3>
                </div>
            </div>
        </div>
    </div>
</div>
