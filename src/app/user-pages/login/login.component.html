<div class="d-flex align-items-center auth px-0">
  <div class="row w-100 mx-0">
    <div class="col-lg-4 mx-auto">
      <div class="auth-form-light text-left py-5 px-4 px-sm-5">
        
        <div class="brand-logo text-center">
          <img src="assets/images/shira-logo.png" alt="logo">
        </div>
        
        <h4 class="text-center">Welcome.</h4>
        
        <form [formGroup]="loginForm" class="pt-3" (ngSubmit)="login()">
          <div class="form-group">
            <input type="email" class="form-control form-control-lg" id="exampleInputEmail1" formControlName="email" placeholder="email">
          </div>
          <div class="form-group">
            <input type="password" class="form-control form-control-lg" id="exampleInputPassword1"
              placeholder="Password" formControlName="password">
          </div>
          <div class="mt-3">
            <button type="submit" class="btn btn-warning btn-fw w-100" [disabled]="loginForm.invalid">
              Login
            </button>
          </div>

          <p *ngIf="loginForm.errors" class="text-danger font-weight-bold mt-3">
            Invalid username or password
          </p>

        </form>
      </div>
    </div>
  </div>
</div>
