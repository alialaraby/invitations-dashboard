<div class="page-header">
    <h3 class="page-title">
        <span class="page-title-icon bg-gradient-primary text-white mr-2">
            <i class="mdi mdi-qrcode-scan"></i>
        </span>
        Scan qr code
    </h3>
    <!-- <nav aria-label="breadcrumb">
        <button type="button" class="btn btn-warning btn-fw" (click)="openAddModal(addModal)">New invitation</button>
    </nav> -->
</div>

<div class="row mx-0 my-4 justify-content-center">
    <div class="col-md-3 col-sm-12 mb-3">
        <button type="button" class="btn btn-warning btn-fw w-100" (click)="handle(action, 'start')">
            Start Scanning
        </button>
    </div>
    <div class="col-md-3 col-sm-12 mb-3">
        <button type="button" class="btn btn-warning btn-fw w-100" (click)="handle(action, 'stop')">
            Stop Scanning
        </button>
    </div>
</div>

<div class="row mx-0">
    <div class="w-md-50 w-sm-75 mx-auto">
        <ngx-scanner-qrcode #action="scanner" [config]="config" (error)="onError($event)"></ngx-scanner-qrcode>
    </div>
</div>

<ng-template #invalidQRModal let-modal class="modal fade" id="exampleModal-2" aria-labelledby="exampleModalLabel-2">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel-2">Invalid.</h5>
            <button type="button" class="close" (click)="modal.dismiss()" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body m-3">
            This invitation is <span class="text-danger font-weight-bold">invalid</span>.
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-light" (click)="modal.close()">Close</button>
        </div>
    </div>
</ng-template>

<ng-template #validQRModal let-modal class="modal fade" id="exampleModal-2" aria-labelledby="exampleModalLabel-2">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel-2">Valid.</h5>
            <button type="button" class="close" (click)="modal.dismiss()" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body m-3">
            This invitation is <span class="text-success font-weight-bold">Accepted</span>.
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-light" (click)="modal.close()">Close</button>
        </div>
    </div>
</ng-template>

<ng-template #alreadyAttendedModal let-modal class="modal fade" id="exampleModal-2" aria-labelledby="exampleModalLabel-2">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel-2">Valid.</h5>
            <button type="button" class="close" (click)="modal.dismiss()" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body m-3">
            This invitation is already <span class="text-success font-weight-bold">Accepted</span>.
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-light" (click)="modal.close()">Close</button>
        </div>
    </div>
</ng-template>
